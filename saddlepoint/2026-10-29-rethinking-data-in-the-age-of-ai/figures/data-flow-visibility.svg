ial,sans-serif" font-size="18" fill="#163452" font-weight="normal">produces new data</text><rect x="820" y="120" width="170" height="140" rx="6" fill="#edf4fa" stroke="#266cad" stroke-width="2"/><text x="905" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#163452" font-weight="bold">Downstream</text><text x="905" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#163452" font-weight="normal">Other users;</text><text x="905" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#163452" font-weight="normal">actions + outcomes</text><path d="M185 190 H275" stroke="#266cad" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="230.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#127b79" font-weight="normal">Hidden</text><path d="M455 190 H545" stroke="#266cad" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#127b79" font-weight="normal">Visible</text><path d="M725 190 H815" stroke="#266cad" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="770.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#127b79" font-weight="normal">Hidden</text><circle cx="365" cy="292" r="7" fill="#127b79"/><text x="365" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#127b79" font-weight="normal">Producer’s viewpoint</text><path d="M70 370 H190" stroke="#266cad" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="590" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#163452" font-weight="normal">Solid: observed exchange and agreed records</text><path d="M70 417 H190" stroke="#266cad" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="590" y="423" tex